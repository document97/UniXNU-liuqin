name: publish package

# Turns the artifacts of a package run into release assets.
#
# Two problems this solves, both about getting 19 GB to a person on a slow link:
#
# An artifact is not a link one can hand to a download manager: downloading one
# means asking the API with a token, and the answer is a signed URL that expires
# within minutes, so a segmented download dies partway. Release assets are stable
# URLs that survive resumption and are capped at 2 GiB per file, so every piece is
# split before it is uploaded.
#
# The package workflow stores its parts with -mx=0, so 19 GB of image arrives as
# 19 GB of archive: the Data volume alone is a fresh 8 GiB APFS container that is
# almost entirely zero. Recompressing here costs runner time instead of the
# reader's bandwidth. Compression and AES-256 with an encrypted header happen in
# the same pass, so the parts stay as unreadable without the password as before.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: the package run whose artifacts to publish
        required: true
        type: string
      userdata_run_id:
        description: the run holding liuqin-userdata, when it is not run_id
        required: false
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: reclaim disk
        run: |
          set -euo pipefail
          df -h /
          # Peak is the 19 GiB of artifacts plus one recompressed part. The
          # stock image is mostly tool caches this job never touches.
          need=$((26 * 1024 * 1024))
          avail="$(df -k / | awk 'NR==2 {print $4}')"
          echo "avail_kb=${avail} need_kb=${need}"
          if [ "$avail" -lt "$need" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
            sudo apt-get clean
          fi
          df -h /

      - name: seven zip
        run: |
          set -euo pipefail
          command -v 7z >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq p7zip-full; }
          7z i | head -3

      - name: download the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -D in
          # A run that reused an earlier userdata image holds only the boot side:
          # the 19 GB is in the run that built it.
          if [ -n "${{ inputs.userdata_run_id }}" ]; then
            gh run download "${{ inputs.userdata_run_id }}" -R "${{ github.repository }}" -D in/userdata
          fi
          find in -type f -printf '%12s %p\n' | sort -rn
          df -h /

      - name: recompress the parts, one at a time
        env:
          ARTIFACT_PASSWORD: ${{ secrets.LIUQIN_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          # gh run download writes one directory per artifact, so the files are a
          # level down. Each pass holds one source part and its replacement, so the
          # source goes as soon as the replacement tests good.
          while IFS= read -r f
          do
            name="$(basename "$f")"
            size="$(stat -c %s "$f")"
            printf '\n=== %s (%s B) ===\n' "$f" "$size"
            case "$f" in
              *.7z)
                base="${name%.7z}"
                dest="out/${base}.7z"
                if [ "$size" -gt $((1024*1024*1024)) ]; then
                  # The userdata parts are single-file archives written with
                  # -mx=0 on a Linux runner. p7zip's -so handles those and
                  # streaming keeps a second 5 GiB copy off the runner disk.
                  7z x -p"${ARTIFACT_PASSWORD}" -so "$f" \
                    | 7z a -t7z -mx=5 -mmt=on -mhe=on -p"${ARTIFACT_PASSWORD}" \
                          -si"${base}" "$dest" > /dev/null
                else
                  # Small archives are multi-file trees (liuqin-package.7z has
                  # boot/, payload/, kernel/ and logs). p7zip's -so silently
                  # emits only a few hundred bytes for those, so a recompress
                  # through the pipe produces a valid but EMPTY archive. They
                  # are already -mx=1 compressed, so copying loses almost
                  # nothing and keeps every file.
                  cp -f "$f" "$dest"
                fi
                7z t -p"${ARTIFACT_PASSWORD}" "$dest" > /dev/null
                # A 832-byte "recompressed" 5 GiB part must never be published.
                if [ "$size" -gt $((1024*1024)) ] \
                   && [ "$(stat -c %s "$dest")" -lt $((1024*1024)) ]; then
                  echo "${name}: ${size} B became $(stat -c %s "$dest") B"
                  exit 1
                fi
                echo "published ${base}: $(stat -c %s "$dest") B (from ${size} B)"
                rm -f "$f"
                ;;
              *)
                cp -f "$f" "out/${name}"
                ;;
            esac
            df -h / | tail -1
          done < <(find in -type f | sort)

      - name: split into under-2-GiB pieces
        run: |
          set -euo pipefail
          cd out
          for f in *; do
            [ -f "$f" ] || continue
            if [ "$(stat -c %s "$f")" -gt $((1900*1024*1024)) ]; then
              split -b 1900M -d -a 3 "$f" "${f}."
              echo "split ${f} into $(ls "${f}".* | wc -l) pieces"
              rm -f "$f"
            fi
          done
          # The release would refuse anything larger, so fail here instead.
          if find . -type f -size +2047M | grep -q .; then
            echo 'an asset still exceeds the 2 GiB release limit'
            exit 1
          fi
          ls -la
          du -ch -- * 2>/dev/null | tail -1

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd out
          sha256sum -- * > SHA256SUMS.txt
          tag="pkg-${{ inputs.run_id }}"
          notes="Artifacts of package run ${{ inputs.run_id }}, recompressed and republished as release assets so the parts can be fetched by a download manager. Each .7z is AES-256 encrypted with an encrypted header; the password is the LIUQIN_ARTIFACT_PASSWORD repository secret. Pieces suffixed .000, .001, ... are one file split at 1900 MiB: concatenate in suffix order before extracting. SHA256SUMS.txt covers the pieces as published."
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" ./* -R "${{ github.repository }}" --clobber
          else
            gh release create "$tag" ./* -R "${{ github.repository }}" \
              --title "liuqin package ${{ inputs.run_id }}" --notes "$notes"
          fi
          gh release view "$tag" -R "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.size)\t\(.name)"'
