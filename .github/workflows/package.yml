name: package

# liuqin (Xiaomi Pad 6 Pro). The pipeline is pong's, with these differences:
#   * the firmware tree is Document97/uefi-liuqin (liuqinPkg), and the configuration
#     stays configs/liuqin_ipados18_defconfig, which already leaves out the stages
#     that need non-public firmware (pong repoints to its CI defconfig instead);
#   * the bootable image is boot/liuqin-xnu-initial.img for ONE RAM-only
#     `fastboot boot` from the stock ABL: kernel slot = gzip(BootShim + FD) of
#     release's boot.img followed by the stock Cape SoC DTB (from the encrypted
#     release stock-V14.0.9.0.TMYCNXM of uefi-liuqin), ramdisk = PONGFAT1 payload;
#   * the repository is public, so every artifact that carries Apple or vendor bytes
#     is uploaded only as AES-256 7z with the secret LIUQIN_ARTIFACT_PASSWORD, and
#     kept for a short time.
#   * board firmware comes from the same encrypted stock release: touch/ (NT36532) and
#     fw/wlan/ (QCA6490) are embedded in the kernel, fw/adsp/ is merged into adsp.mbn
#     and staged into the OS volume by the userdata job.
# The pong text below still describes the shared parts.
# (Re-touched 2026-11-12 and again 2026-11-14 so GitHub registers this workflow in the
# recreated repository: a fresh repository did not index it from the first push either time.)

# docs/porting/packaging.md, plus the artifact that document leaves out: the
# userdata image.
#
#   package   runs scripts/package.sh, i.e. `unixnu release -D .` with its fixed
#             steps deps, preflight, patches, build, pack, verify, and writes
#             out/pong/ipados-18.7.10-22H374/<config>/{boot/boot.img,
#             payload/payload.img, kernel/kernel.macho, package.manifest.json}.
#   userdata  builds the SHNGROOT image the NativeUfs transport reads as the root
#             filesystem, and its volume UUIDs are what the kernel is compiled with.
#
# The two jobs are separate because they compete for disk, not for CPU: the
# userdata chain peaks near 37 GiB and the package job near 25 GiB of XNU objects
# and EDK II output, and one hosted runner has 14 GiB of RAM and 80-180 GiB of
# disk. The package job needs one thing from the other job, ci-volume-layout.json,
# and that is a two-KB file.
#
# Why the userdata image is not `unixnu userdata`: that step writes the windows
# of [userdata] windows, which come from IPSW components, and writes the manifest
# as version 2 as soon as --object adds anything. This board's transport
# (drivers/NativeUfs/RootLayout.h) accepts version 1 only, needs a "Data" window
# that is not an IPSW component, and rejects a window whose block size or flags
# are not 512/1. The device scripts therefore own this chain; see the packaging
# area of porting.toml.
#
# Why a second boot image: the firmware (uefi-pong Platforms/Nothing/pongPkg/
# Drivers/PongBootMemoryDxe) publishes an initrd only when it carries the
# PONGFAT1 envelope, and `release` puts payload.img in the ramdisk slot unchanged.
# The package job also writes boot/pong-xnu-initial.img with payload.img wrapped
# and the container the local flow produces, so one image is the document's
# artifact and the other is the flashable one. scripts/finalize-pong-adt.py
# writes it under the same ADT parameters the local build uses.
#
# Nothing Apple's is committed: the IPSW is downloaded on the runner and goes
# away with it. The platform seed comes from the repository secret
# UNIXNU_UNIQUE_CHIP_ID and is baked into the images.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["ipados-18.7.10-22H374"]
        default: "ipados-18.7.10-22H374"
      prelink:
        description: "Prelink the original 22H374 kernelcache into kernel.macho"
        type: boolean
        default: false
      ipsw_url:
        description: "https URL of the iPadOS 18.7.10 / 22H374 restore (.ipsw). Empty skips the userdata image."
        type: string
        default: ""
      ipsw_sha256:
        description: "Optional sha256 of that IPSW; a mismatch stops the run."
        type: string
        default: ""
      reuse_userdata_run:
        description: "Run id whose liuqin-userdata / volume-layout artifacts to build from; empty builds them again."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  # A push carries no inputs context at all, so each value a step reads is copied
  # here once and read from the environment.
  OS_PROFILE: ${{ inputs.os || 'ipados-18.7.10-22H374' }}
  IPSW_URL: ${{ inputs.ipsw_url }}
  IPSW_SHA256: ${{ inputs.ipsw_sha256 }}
  PRELINK: ${{ inputs.prelink }}
  BOARD: liuqin
  CONFIG: liuqin_ipados18
  STOCK_REPO: Document97/uefi-liuqin
  STOCK_RELEASE: stock-V14.0.9.0.TMYCNXM
  # Pinned: `release`, its steps and this repository's scripts/package.sh are one
  # interface. Move both together.
  UNIXNU_REF: c96b29975645b711dc06bc435c3ad27321ce817c
  # The Homebrew kegs the Tier 3 Intel runner has but does not link.
  LLVM_KEG: /usr/local/opt/llvm@18
  LLD_KEG: /usr/local/opt/lld
  # Outside the workspace: the boot job restores it from the actions cache, and
  # nothing under device/ should ever see a stray compiler cache.
  CCACHE_DIR: /Users/runner/ccache

jobs:
  userdata:
    name: userdata image
    # Rebuilding it costs ~28 minutes and 19 GB of runner disk; when a run is only
    # being redone for the boot side, the artifacts of the earlier one are reused.
    if: inputs.reuse_userdata_run == ''
    runs-on: macos-15-intel
    timeout-minutes: 300
    outputs:
      staged: ${{ steps.userland.outputs.staged }}
    steps:
      - name: artifact password
        env:
          ARTIFACT_PASSWORD: ${{ secrets.LIUQIN_ARTIFACT_PASSWORD }}
        run: |
          if [ "${#ARTIFACT_PASSWORD}" -lt 12 ]; then
            echo "::error::Set the repository secret LIUQIN_ARTIFACT_PASSWORD (12+ characters): artifacts carry Apple and vendor bytes and are only uploaded encrypted."
            exit 1
          fi
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          command -v 7zz >/dev/null || brew install sevenzip
          7zz i | head -3
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - name: reclaim disk
        run: |
          set -euo pipefail
          selected="$(xcode-select -p)"
          echo "xcode-select: ${selected}"
          # Peak of this job is about 37 GiB: a 7.4 GiB download, the expanded
          # restore, two AEA decryptions, a fresh 5 GiB SystemOS and 8 GiB Data
          # volume, and a 19 GiB image. The unused Xcode copies go below 80 GiB
          # free; the selected one always stays.
          need=$((80 * 1024 * 1024))
          avail="$(df -k / | awk 'NR==2 {print $4}')"
          echo "avail_kb=${avail} need_kb=${need}"
          if [ "$avail" -lt "$need" ]; then
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              case "$selected" in
                "$app"/*) echo "keep $app" ;;
                *) echo "remove $app"; sudo rm -rf "$app" ;;
              esac
            done
          fi
          sudo rm -rf /Library/Developer/CoreSimulator/Caches /Library/Developer/CoreSimulator/Devices || true
          rm -rf "$HOME/Library/Developer/CoreSimulator" "$HOME/Library/Developer/Xcode/DerivedData" || true
          df -h
      - name: tools
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          ok=1
          for t in hdiutil diskutil aea python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          # apply and build-systemos18 attach images with ownership on, so they
          # need root without a prompt. A runner that cannot sudo is a failure,
          # not a skip: a userland prepared without it boots nothing.
          sudo -n true || { echo 'this runner cannot sudo -n, and the userland chain needs it'; ok=0; }
          [ "$ok" = 1 ]
      - name: python dependencies
        # scripts/decrypt-ipados18-aea.py unwraps the profile-1 archive key with pyhpke,
        # and the runner image does not ship it. A job without ipsw_url never decrypts,
        # which is how this went unnoticed until the first run that passed one; a job
        # with ipsw_url cannot get past the OS decrypt without it.
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --user --disable-pip-version-check pyhpke \
            || python3 -m pip install --break-system-packages --disable-pip-version-check pyhpke
          python3 -c 'from pyhpke import AEADId, CipherSuite, KDFId, KEMId, KEMKey; print("pyhpke import ok")'
      - name: ADSP firmware from the stock release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PASSWORD: ${{ secrets.LIUQIN_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          # drivers/PongPower loads /pong/firmware/adsp.mbn from the OS volume (battery and
          # charger state come from the ADSP over PMIC GLINK). The stock vendor partition has
          # the split form, adsp.mdt + adsp.bNN; merge-qcom-mdt.py puts the segments back at
          # their offsets without altering the signed image. apply copies it into the OS copy,
          # and the userdata parts leave CI only encrypted.
          gh release download "${STOCK_RELEASE}" -R "${STOCK_REPO}" -p '*.7z' -D "${RUNNER_TEMP}/adsp-dl"
          7zz x -y "-p${ARTIFACT_PASSWORD}" "-o${RUNNER_TEMP}/adsp-stock" "${RUNNER_TEMP}"/adsp-dl/*.7z > /dev/null
          python3 - "${RUNNER_TEMP}/adsp-stock" <<'EOF'
          import hashlib, json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          m = json.loads((d / "stock-manifest.json").read_text())
          adsp = {n: w for n, w in m["files"].items() if n.startswith("fw/adsp/adsp.")}
          if not adsp:
              raise SystemExit("the stock release has no fw/adsp/ entries")
          for name, want in adsp.items():
              got = hashlib.sha256((d / name).read_bytes()).hexdigest()
              assert got == want["sha256"], f"{name}: {got} != {want['sha256']}"
          print("ADSP segments verified:", len(adsp))
          EOF
          mkdir -p "${RUNNER_TEMP}/board-firmware"
          python3 device/scripts/merge-qcom-mdt.py "${RUNNER_TEMP}/adsp-stock/fw/adsp/adsp.mdt" "${RUNNER_TEMP}/board-firmware/adsp.mbn"
          rm -rf "${RUNNER_TEMP}/adsp-dl" "${RUNNER_TEMP}/adsp-stock"
      - name: prepared userland from the IPSW
        id: userland
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$(printf '%s' "${IPSW_URL}" | tr -d '[:space:]')"
          sha="$(printf '%s' "${IPSW_SHA256}" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          if [ -z "$url" ]; then
            echo 'No ipsw_url input: no prepared userland, so this job builds no userdata image.'
            echo 'The package job still runs and packages the kernel, the payload and the boot'
            echo 'image; its volume layout falls back to uuid5 placeholders.'
            printf '%s\n' 'staged=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$url" in
            https://*) ;;
            *) echo "ipsw_url must be an https URL, got: ${url}" >&2; exit 1 ;;
          esac
          rm -rf "${RUNNER_TEMP}/pong-userland" "${RUNNER_TEMP}/pong-ipsw-work"
          python3 device/scripts/prepare-pong-userland-from-ipsw.py \
            --ipsw-url "$url" \
            --work-dir "${RUNNER_TEMP}/pong-ipsw-work" \
            --out "${RUNNER_TEMP}/pong-userland" \
            --developer "$(xcode-select -p)" \
            --json-out ci-userland-from-ipsw.json \
            --volume-layout-out ci-volume-layout.json \
            --jobs 4 \
            --board-firmware "${RUNNER_TEMP}/board-firmware" \
            ${sha:+--ipsw-sha256 "$sha"}
          printf '%s\n' "${RUNNER_TEMP}/pong-userland" > ci-userland-path.txt
          # The layout below reads the images this run made; a placeholder UUID
          # here would compile a kernel that mounts nothing.
          python3 - <<'PY'
          import json
          from pathlib import Path
          layout = json.loads(Path('ci-volume-layout.json').read_text())
          report = json.loads(Path('ci-userland-from-ipsw.json').read_text())
          if layout.get('ci_placeholder'):
              raise SystemExit('ci-volume-layout.json still holds placeholders')
          for key in ('os', 'systemos', 'data'):
              if len(layout.get(key, {}).get('uuid', '')) != 36:
                  raise SystemExit('ci-volume-layout.json has no usable %s uuid' % key)
          if report.get('build') != '22H374':
              raise SystemExit('the userland report names build %r' % report.get('build'))
          print('userland bytes', report['userland_bytes'], 'in', report['seconds'], 'seconds')
          for name in ('os', 'systemos', 'data'):
              print(' ', name, layout[name]['uuid'])
          PY
          df -h
          printf '%s\n' 'staged=true' >> "$GITHUB_OUTPUT"
      - name: SHNGROOT directory
        if: steps.userland.outputs.staged == 'true'
        # This reads every byte of roughly 19 GiB to record the SHA-256 of each
        # window, and it is the slow, disk-bound part of the job.
        timeout-minutes: 120
        run: |
          set -euo pipefail
          prepared="$(cat ci-userland-path.txt)"
          mkdir -p out/ipados18/ufs
          python3 device/scripts/prepare-ipados18-ufs-layout.py \
            --userland "${prepared}" \
            --systemos "${prepared}/pong-ipados18-systemos.cdr" \
            --volume-layout ci-volume-layout.json \
            --output-dir out/ipados18/ufs
          python3 - <<'PY'
          import json
          from pathlib import Path
          header = Path('out/ipados18/ufs/shngroot-ipados18.bin').read_bytes()
          layout = json.loads(Path('out/ipados18/ufs/ufs-layout.json').read_text())
          names = [window['name'] for window in layout['windows']]
          if header[:8] != b'SHNGROOT' or len(header) != 4096:
              raise SystemExit('the SHNGROOT header is not a 4096-byte directory')
          if names != ['OS', 'SystemOS', 'Data']:
              raise SystemExit('layout windows are %s, not OS/SystemOS/Data' % names)
          print('SHNGROOT directory', len(header), 'bytes for', ', '.join(names))
          PY
          df -h
      - name: userdata image
        if: steps.userland.outputs.staged == 'true'
        # Writes about 19 GiB more. upload-artifact caps one artifact at 10 GiB,
        # so the builder writes parts: four of them, each at most 8 GiB.
        timeout-minutes: 150
        run: |
          set -euo pipefail
          prepared="$(cat ci-userland-path.txt)"
          mkdir -p ci-products
          python3 device/scripts/build-pong-userdata-image.py \
            --layout out/ipados18/ufs/ufs-layout.json \
            --header out/ipados18/ufs/shngroot-ipados18.bin \
            --output out/ipados18/ufs/pong-ipados18-userdata.img \
            --max-parts 4 \
            --part-max-mib 8192 \
            --delete-sources \
            --delete-root "${prepared}" \
            --json-out userdata-image.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          image = json.loads(Path('userdata-image.json').read_text())
          if image['image_bytes'] <= 0 or not image['parts']:
              raise SystemExit('the image builder wrote no parts')
          total = sum(part['bytes'] for part in image['parts'])
          if total != image['image_bytes']:
              raise SystemExit('the parts hold %d bytes, the image is %d' % (total, image['image_bytes']))
          print('userdata image', image['image_bytes'], 'bytes in', len(image['parts']), 'part(s)')
          Path('ci-products/userdata-image.json').write_text(json.dumps(image, indent=2) + '\n')
          PY
          cp -f ci-volume-layout.json ci-products/ci-volume-layout.json
          df -h
      - name: encrypt the userdata parts
        if: steps.userland.outputs.staged == 'true'
        env:
          ARTIFACT_PASSWORD: ${{ secrets.LIUQIN_ARTIFACT_PASSWORD }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          # One part at a time, deleting each plaintext part once its archive tests
          # good, so the disk holds at most one extra part.
          mkdir -p upload-userdata
          cp -f ci-products/* upload-userdata/
          for part in out/ipados18/ufs/pong-ipados18-userdata.img.part*; do
            name="$(basename "$part")"
            7zz a -t7z -mx=0 -mhe=on "-p${ARTIFACT_PASSWORD}" "upload-userdata/${name}.7z" "$part" > /dev/null
            7zz t "-p${ARTIFACT_PASSWORD}" "upload-userdata/${name}.7z" > /dev/null
            rm -f "$part"
            echo "encrypted ${name}"
          done
          df -h
      - uses: actions/upload-artifact@v4
        if: steps.userland.outputs.staged == 'true'
        with:
          name: liuqin-userdata
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: upload-userdata/
      - uses: actions/upload-artifact@v4
        # Always, so the package job has one shape to read either way: the file is
        # absent when nothing was staged.
        if: always()
        with:
          name: volume-layout
          retention-days: 1
          if-no-files-found: ignore
          path: |
            ci-volume-layout.json
            userdata-image.json

  package:
    name: boot image, payload and kernel
    needs: userdata
    # A missing userdata image is not a reason to withhold the rest.
    if: always() && !cancelled()
    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - name: artifact password
        env:
          ARTIFACT_PASSWORD: ${{ secrets.LIUQIN_ARTIFACT_PASSWORD }}
        run: |
          if [ "${#ARTIFACT_PASSWORD}" -lt 12 ]; then
            echo "::error::Set the repository secret LIUQIN_ARTIFACT_PASSWORD (12+ characters): artifacts carry Apple and vendor bytes and are only uploaded encrypted."
            exit 1
          fi
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          command -v 7zz >/dev/null || brew install sevenzip
          7zz i | head -3
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Document97/uefi-liuqin
          ref: liuqin
          # The firmware tree the volume and the boot image are built from.
          path: uefi-liuqin
          submodules: recursive
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: volume-layout
          path: device
          # Defaults to this run; a reused run supplies the layout the userdata
          # image was built against, which the boot side has to agree with.
          run-id: ${{ inputs.reuse_userdata_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: reclaim disk
        run: |
          set -euo pipefail
          selected="$(xcode-select -p)"
          need=$((80 * 1024 * 1024))
          avail="$(df -k / | awk 'NR==2 {print $4}')"
          echo "avail_kb=${avail} need_kb=${need}"
          if [ "$avail" -lt "$need" ]; then
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              case "$selected" in
                "$app"/*) echo "keep $app" ;;
                *) echo "remove $app"; sudo rm -rf "$app" ;;
              esac
            done
          fi
          sudo rm -rf /Library/Developer/CoreSimulator/Caches /Library/Developer/CoreSimulator/Devices || true
          rm -rf "$HOME/Library/Developer/CoreSimulator" "$HOME/Library/Developer/Xcode/DerivedData" || true
          df -h
      - name: tools
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          # cmake, ninja and llvm have no bottle on this Tier 3 runner, so nothing
          # installs them: the image's own copies are used, and the llvm keg is put
          # on PATH rather than linked.
          brew install dtc lzfse mtools nasm acpica
          # The macos-15 image of 2026-08 no longer carries the lld keg; the formula
          # links to /usr/local/opt/lld, which is LLD_KEG.
          if [ ! -x "${LLD_KEG}/bin/lld-link" ]; then
            brew install lld
            ls "${LLD_KEG}/bin/"
          fi
          ok=1
          for t in dtc lzfse mformat mcopy nasm iasl cmake ninja make unifdef python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          # CLANG_BIN needs a clang with llvm-lib and lld-link beside it; Apple's
          # clang has neither, so the keg's bin directory is what the firmware step
          # links into its toolchain directory.
          for t in clang llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-lib llvm-rc; do
            [ -x "${LLVM_KEG}/bin/${t}" ] || { echo "missing tool: ${LLVM_KEG}/bin/${t}"; ok=0; }
          done
          for t in lld-link ld64.lld; do
            [ -x "${LLD_KEG}/bin/${t}" ] || { echo "missing tool: ${LLD_KEG}/bin/${t}"; ok=0; }
          done
          dtc --version
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          set -euo pipefail
          # [payload.adt] asks for the seed and the payload step refuses to run
          # without it: it is the per-chip value the device tree is bound to, and
          # the images serve that one device.
          chip="$(printf '%s' "${CHIP_ID}" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          if ! printf '%s' "$chip" | grep -Eq '^[0-9a-f]{8}$'; then
            echo 'the repository secret UNIXNU_UNIQUE_CHIP_ID must be 8 hexadecimal digits' >&2
            echo 'set it to the unique chip id of the device these images are for' >&2
            exit 1
          fi
          echo "platform seed ${chip}"
      - name: select the configuration this runner can build
        # liuqin_ipados18_defconfig is already the CI-safe configuration.
        if: env.BOARD == 'pong'
        run: |
          set -euo pipefail
          # `release` reads its configuration from [package.defconfig], and that
          # mapping names the shipping defconfig, whose Wi-Fi, backlight and
          # Adreno stages need firmware this public repository does not carry.
          # Its precedence over a remembered selection leaves no flag to choose
          # another, so the mapping is repointed on the runner; the repository
          # keeps the shipping one.
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          path = Path('device/board.toml')
          lines = path.read_text().splitlines(keepends=True)
          try:
              table = lines.index('[package.defconfig]\n')
          except ValueError:
              raise SystemExit('board.toml has no [package.defconfig] table')
          for index in range(table + 1, len(lines)):
              line = lines[index]
              if line.startswith('['):
                  break
              match = re.fullmatch(r'([^\s=]+)(\s*=\s*)("[^"]*")\s*', line)
              if not match:
                  continue
              lines[index] = match.group(1) + match.group(2) + json.dumps('pong_ipados18_ci_defconfig') + '\n'
              break
          else:
              raise SystemExit('[package.defconfig] has no entry to repoint')
          path.write_text(''.join(lines))
          mapping = tomllib.loads(path.read_text())['package']['defconfig']
          profile = os.environ['OS_PROFILE']
          if mapping != {profile: 'pong_ipados18_ci_defconfig'}:
              raise SystemExit('repointing left %r' % (mapping,))
          print('configuration %s -> %s' % (profile, mapping[profile]))
          PY
      - name: install the OS profile and the component recipe
        run: |
          set -euo pipefail
          python3 device/scripts/install-unixnu-inputs.py --unixnu UniXNU
          # XNU 11417 has no BCM2837 machine config; the kit recipe builds PONG.
          python3 device/scripts/patch-unixnu-kernel-step.py --unixnu UniXNU
      - name: check the patch set
        working-directory: device
        run: |
          set -euo pipefail
          # git apply stops each hunk once the counts in its @@ line are
          # satisfied, so a hunk that under-counts drops its last line without
          # any error: run 43179421190 compiled for 11 minutes and only then
          # reported that pong_ramoops_console_init had no closing brace. This
          # check costs a second and runs before anything is compiled.
          python3 scripts/check-xnu-patches.py
      - name: build inputs
        run: |
          set -euo pipefail
          # The kernel is compiled with the UUIDs of the volumes it mounts: the kit
          # recipe hands them to scripts/build-ipados18-pong-macos.py, which writes
          # XNU_OWNER_ROOT/DATA/CACHE_VOLUME_UUID. When this run built a userdata
          # image it uses that layout. Otherwise the UUIDs are uuid5 placeholders,
          # and boot-pong.json records the run as not flashable.
          if [ -s device/ci-volume-layout.json ]; then
            cp -f device/ci-volume-layout.json ci-volume-layout.json
            echo 'volume layout: the userdata image of this run'
          else
            python3 - <<'PY'
          import json, uuid
          from pathlib import Path
          # One fixed namespace, so two placeholder runs agree and a cached kernel
          # object tree stays usable.
          namespace = uuid.UUID('6f1b6a3e-7c2d-4a91-9e5b-0c4d8f2a1b77')
          doc = {'ci_placeholder': True, 'build': '22H374', 'lba_bytes': 4096}
          for role in ('os', 'systemos', 'data'):
              doc[role] = {'uuid': str(uuid.uuid5(namespace, 'pong-%s' % role))}
          Path('ci-volume-layout.json').write_text(json.dumps(doc, indent=2) + '\n')
          print('volume layout: uuid5 placeholders, no userdata image in this run')
          for role in ('os', 'systemos', 'data'):
              print(' ', role, doc[role]['uuid'])
          PY
          fi
          # local.toml is this repository's own table, ignored by git. The kit
          # recipe reads it to find the build tree, the Xcode developer directory
          # and the volume layout; [kernel.prelink] kernel is a path inside the tree.
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          developer = subprocess.check_output(['xcode-select', '-p'], text=True).strip()
          lines = ['# Written on the runner; not a developer machine path.',
                   '[pong_build]',
                   'tree = ' + json.dumps(str(Path('tree').resolve())),
                   'developer_dir = ' + json.dumps(developer),
                   'volume_layout = ' + json.dumps(str(Path('ci-volume-layout.json').resolve())),
                   '']
          Path('device/local.toml').write_text('\n'.join(lines))
          print(Path('device/local.toml').read_text())
          PY
          {
            printf 'PONG_VOLUME_LAYOUT=%s\n' "$PWD/ci-volume-layout.json"
            printf 'PATH=%s:%s:%s\n' "${LLVM_KEG}/bin" "${LLD_KEG}/bin" "$PATH"
          } >> "$GITHUB_ENV"
      - name: touch firmware from the stock release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PASSWORD: ${{ secrets.LIUQIN_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          # The NT36532 is flashless: drivers/LiuqinTouch downloads the panel's image
          # at every boot, and build-xnu-ipados18.sh embeds the images found in
          # LIUQIN_TOUCH_FW_DIR into the kernel (which leaves CI only encrypted). The
          # images come from the stock vendor partition and travel in the same AES-256
          # stock release as the Cape DTB, under touch/, checked against its manifest.
          # A stock release without them still builds; the driver then reports that
          # the kernel carries no firmware.
          gh release download "${STOCK_RELEASE}" -R "${STOCK_REPO}" -p '*.7z' -D "${RUNNER_TEMP}/touch-dl"
          7zz x -y "-p${ARTIFACT_PASSWORD}" "-o${RUNNER_TEMP}/touch-stock" "${RUNNER_TEMP}"/touch-dl/*.7z > /dev/null
          python3 - "${RUNNER_TEMP}/touch-stock" <<'EOF'
          import hashlib, json, os, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          m = json.loads((d / "stock-manifest.json").read_text())
          touch = {n: w for n, w in m["files"].items() if n.startswith("touch/")}
          wlan = {n: w for n, w in m["files"].items() if n.startswith("fw/wlan/")}
          for name, want in {**touch, **wlan}.items():
              got = hashlib.sha256((d / name).read_bytes()).hexdigest()
              assert got == want["sha256"], f"{name}: {got} != {want['sha256']}"
          if touch:
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write(f"LIUQIN_TOUCH_FW_DIR={d / 'touch'}\n")
              print("touch firmware verified: " + ", ".join(sorted(touch)))
          else:
              print("::warning::stock release has no touch/ images: the kernel will carry no NT36532 firmware")
          EOF
      - name: Wi-Fi firmware and native board sources
        run: |
          set -euo pipefail
          # PongPower (ADSP + battery) and PongWifi (QCA6490 over ath11k) build against the
          # public sources pinned in configs/pong-native-sources.toml: UniXNU-sheng (QcomRpmh),
          # Ath12kWifi (the Darwin network ABI) and Linux v7.0.14 (ath11k/MHI). The paths go to
          # GITHUB_ENV as PONG_* variables, which build-ipados18-pong-macos.py passes through.
          src="${RUNNER_TEMP}/native-sources"
          export PONG_SHENG_ROOT="$src/UniXNU-sheng" PONG_WIFI_SHARED="$src/Ath12kWifi" PONG_WIFI_SOURCE="$src/linux-7.0.14"
          python3 device/scripts/fetch-pong-native-sources.py --only sheng_source --only wifi_shared --only wifi_linux
          # In UniXNU-sheng, drivers/Ath12kWifi is a submodule that the pinned shallow fetch leaves
          # empty; build-xnu-ipados18.sh checks its files there before compiling, so it points at
          # the Ath12kWifi checkout pinned above.
          sub="$PONG_SHENG_ROOT/drivers/Ath12kWifi"
          if [ -d "$sub" ] && [ -z "$(ls -A "$sub")" ]; then rmdir "$sub"; fi
          [ -e "$sub" ] || ln -s "$PONG_WIFI_SHARED" "$sub"
          test -f "$sub/include/nw_abi.h"
          # The radio images and Xiaomi's board calibration come from fw/wlan/ of the stock
          # release the touch step verified; the Wi-Fi build embeds them in the kernel, which
          # leaves CI only encrypted.
          python3 device/scripts/stage-liuqin-wifi-firmware.py "${RUNNER_TEMP}/touch-stock/fw/wlan" "${RUNNER_TEMP}/liuqin-wifi"
          {
            printf 'PONG_SHENG_ROOT=%s\n' "$PONG_SHENG_ROOT"
            printf 'PONG_WIFI_SHARED=%s\n' "$PONG_WIFI_SHARED"
            printf 'PONG_WIFI_SOURCE=%s\n' "$PONG_WIFI_SOURCE"
            printf 'PONG_WIFI_FIRMWARE=%s\n' "${RUNNER_TEMP}/liuqin-wifi/qca6490"
          } >> "$GITHUB_ENV"
      # The kernel is 913 translation units and a fresh runner starts with an
      # empty build tree, so before this a one-file patch cost the same ~29
      # minutes as a full build. ccache keys on the preprocessed source, so a
      # rebuild after a patch reuses every object the patch did not touch.
      #
      # The key carries github.run_id, which makes the exact key always miss:
      # actions/cache cannot update an entry, so the rolling key plus a prefix
      # in restore-keys is what makes the cache advance from run to run.
      - name: ccache cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.UNIXNU_REF }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.UNIXNU_REF }}-
      - name: ccache toolchain
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          command -v ccache >/dev/null || brew install ccache

          # The kit recipe does not set CC, so makedefs/MakeInc.cmd picks the
          # compiler itself:
          #
          #   ifeq ($(origin CC),default)
          #       export CC := $(shell $(XCRUN) -sdk $(SDKROOT) -find clang)
          #
          # An absolute path into Xcode never consults PATH again, which is why a
          # PATH shim in front of ccache saw zero compiles. Exporting CC from the
          # environment gives it a non-default origin, so the makefiles keep the
          # value as written - and that value can be the wrapper itself.
          #
          # The wrapper is a script rather than "ccache /path/clang": mig runs the
          # compiler through env, which does not split on spaces, so a two-word
          # CC becomes a single nonexistent program name and installhdrs dies on
          # the first MIG rule. A one-file shim keeps CC a single path - and
          # naming it clang also keeps the makefiles' "is this clang" tests true.
          #
          # The path is absolute instead of a bare name on purpose:
          # /usr/local/opt/llvm@18/bin sits ahead of /usr/bin on these runners
          # (the kit links with that keg's lld), and a bare "clang" resolved to
          # Homebrew LLVM 18 in run 43726464692. LLVM has no
          # __builtin_xnu_type_summary, so every kalloc_type() in bsd, osfmk,
          # iokit and security failed with "use of unknown builtin" five minutes
          # in, hundreds of files deep.
          ccache_bin="$(command -v ccache)"
          real_cc="$(/usr/bin/xcrun -find clang)"
          real_cxx="$(/usr/bin/xcrun -find clang++)"
          wrap="${RUNNER_TEMP}/ccache-wrap"
          mkdir -p "$wrap"
          for pair in "clang:${real_cc}" "clang++:${real_cxx}" "cc:${real_cc}" "c++:${real_cxx}"; do
            name="${pair%%:*}"
            target="${pair#*:}"
            printf '#!/bin/sh\nexec %s %s "$@"\n' "${ccache_bin}" "${target}" > "${wrap}/${name}"
            chmod +x "${wrap}/${name}"
          done
          {
            printf 'CC=%s/clang\n' "${wrap}"
            printf 'CXX=%s/clang++\n' "${wrap}"
            printf 'CCACHE_BASEDIR=%s\n' "$GITHUB_WORKSPACE"
            printf 'CCACHE_NOHASHDIR=true\n'
            # Default compiler check is mtime+size; a restored cache and a fresh
            # checkout both change mtime, which would invalidate everything.
            printf 'CCACHE_COMPILERCHECK=content\n'
            printf 'CCACHE_SLOPPINESS=time_macros,include_file_ctime,include_file_mtime,file_stat_matches\n'
            # 913 XNU translation units plus the kit's own objects need more than
            # 2 GB, and GitHub's cache quota is 10 GB per repository. 4 GB holds
            # one generation at full width and leaves room for the previous one
            # to survive long enough to be restored.
            printf 'CCACHE_MAXSIZE=4G\n'
            printf 'CCACHE_UMASK=002\n'
          } >> "$GITHUB_ENV"
          echo "ccache: $("${ccache_bin}" --version | head -1)"
          echo "compiler: ${real_cc} ($("${real_cc}" --version | head -1))"
          echo "compiler++: ${real_cxx}"
          echo "ccache dir: ${CCACHE_DIR} ($(du -sh "${CCACHE_DIR}" 2>/dev/null | cut -f1 || echo empty))"

          # Apple clang only: __builtin_xnu_type_summary backs every kalloc_type()
          # call in the tree. A toolchain without it fails hundreds of files deep,
          # so ask the exact wrapped compiler now and stop before the build. This
          # is a hard failure on purpose - a green-looking job that cannot compile
          # kalloc_type() wastes a runner and a review cycle.
          cat > "${RUNNER_TEMP}/type-summary-probe.c" <<'PROBE'
          struct probe_s { int a; };
          int probe_fn(void) { return (int)__builtin_xnu_type_summary(struct probe_s); }
          PROBE
          if ! "${wrap}/clang" -fsyntax-only -target arm64-apple-ios18 \
                 "${RUNNER_TEMP}/type-summary-probe.c" 2>"${RUNNER_TEMP}/type-summary-probe.err"; then
            cat "${RUNNER_TEMP}/type-summary-probe.err"
            echo "::error::${real_cc} does not know __builtin_xnu_type_summary, so kalloc_type() cannot compile"
            exit 1
          fi
          echo "type summary builtin: ok"

          # Prove the wrapper reaches ccache, because a bypass is invisible later.
          printf 'int main(void) { return 0; }\n' > "${RUNNER_TEMP}/ccache-probe.c"
          if "${wrap}/clang" -c "${RUNNER_TEMP}/ccache-probe.c" \
               -o "${RUNNER_TEMP}/ccache-probe.o" 2>"${RUNNER_TEMP}/ccache-probe.err"; then
            calls="$("${ccache_bin}" --show-stats | awk '/^Cacheable calls:/ {print $3; exit}')"
            echo "probe compile reached ccache: cacheable calls ${calls:-unknown}"
            if [ "${calls:-0}" = "0" ]; then
              echo "::warning::the probe compiled but ccache did not count it"
            fi
          else
            echo "::warning::ccache probe failed, so the kernel build will run uncached"
            cat "${RUNNER_TEMP}/ccache-probe.err"
          fi
          sysctl -n hw.ncpu
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-liuqin
          UNIXNU_DEVICE: ${{ github.workspace }}/device
          PONG_VOLUME_LAYOUT: ${{ github.workspace }}/ci-volume-layout.json
          PONG_LLVM: ${{ env.LLVM_KEG }}/bin
          UNIXNU_SHARED_XNU_BUILD: '0'
        run: |
          set -euo pipefail
          # macos-15-intel has 4 vCPUs; -j 3 left one of them idle for the whole
          # compile. Ask the machine instead of guessing, and say so in the log.
          jobs="$(sysctl -n hw.ncpu)"
          echo "make -j${jobs}"
          args=(--os "${OS_PROFILE}" --uefi ../uefi-liuqin -j "${jobs}" --unique-chip-id "${UNIXNU_UNIQUE_CHIP_ID}")
          # Without an original kernelcache the kernel step stages the native
          # build as kernel.macho, which is the bootable one. With prelink it
          # prelinks the extracted 22H374 kernelcache instead.
          if [ "${PRELINK:-false}" != 'true' ]; then
            args+=(--skip-prelink)
          fi
          ./scripts/package.sh "${args[@]}"
      - name: ccache statistics
        # Runs even when package failed: a compile error is exactly the case this
        # cache is for.
        if: always()
        run: |
          set -euo pipefail
          # A shim that never fires looks identical to a slow build, so say it
          # out loud. "Cacheable calls" is how many compiles ccache was actually
          # asked to do; zero means the Makefiles bypassed PATH and the cache is
          # dead weight rather than a silent no-op.
          ccache --show-stats || true
          calls="$(ccache --show-stats | awk '/^Cacheable calls:/ {print $3; exit}')"
          echo "cacheable calls: ${calls:-unknown}"
          echo "cache size: $(du -sh "${CCACHE_DIR}" 2>/dev/null | cut -f1 || echo none)"
          if [ "${calls:-0}" = "0" ]; then
            echo "::warning::ccache saw no compiles: CC did not reach ccache, so the cache cannot help"
          fi
      - name: ccache save
        # Saves even when package failed: a compile error 700 files in still
        # leaves 700 usable objects, and keeping them is what makes the retry
        # incremental instead of another full build.
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.UNIXNU_REF }}-${{ github.run_id }}
      - name: check the kernel the payload step patches
        run: |
          set -euo pipefail
          # board.toml sets [payload] panic_screen, so the payload step runs
          # patch-xnu-entry-probe.py --panic-screen on this kernel, and that
          # script refuses a kernel whose entry point, _start_first_cpu, _panic,
          # _vinfo or zero-fill cave do not match its sites. Ask here, where the
          # linked kernel exists, rather than at the end of the payload and boot
          # steps. With panic_screen false the payload step never calls the
          # script, so the check says so and passes.
          python3 device/scripts/check-liuqin-kernel-probe.py \
            "UniXNU/out/${BOARD}/${OS_PROFILE}/${CONFIG}/kernel/kernel.macho" \
            --board device/board.toml
      - name: stock Cape SoC DTB
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PASSWORD: ${{ secrets.LIUQIN_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          # The DTB the stock ABL selects by msm-id, from the build on the tablet
          # (uefi-liuqin release, AES-256 7z). The hardware DTB release appends to
          # its kernel slot describes the board for the ADT and is not one the ABL
          # accepts.
          gh release download "${STOCK_RELEASE}" -R "${STOCK_REPO}" -p '*.7z' -D "${RUNNER_TEMP}/stock-dl"
          7zz x -y "-p${ARTIFACT_PASSWORD}" "-o${RUNNER_TEMP}/stock" "${RUNNER_TEMP}"/stock-dl/*.7z > /dev/null
          python3 - "${RUNNER_TEMP}/stock" <<'EOF'
          import hashlib, json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          m = json.loads((d / "stock-manifest.json").read_text())
          for name, want in m["files"].items():
              got = hashlib.sha256((d / name).read_bytes()).hexdigest()
              assert got == want["sha256"], f"{name}: {got} != {want['sha256']}"
          print(f"stock {m['build']}: {', '.join(m['files'])} verified")
          EOF
      - name: boot image for the firmware
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          set -euo pipefail
          # `release` writes the document's artifacts: boot/boot.img with the raw
          # payload in its ramdisk slot, and an ADT from the shared converter.
          # A local run goes two steps further, and this repeats both with the
          # same parameters, so the images match a local build:
          #
          #   ADT        scripts/make-pong-adt-ipados18.py at 12 GiB of DRAM, a
          #              4 GiB DarwinBoot window and one CPU. The shared converter
          #              writes root, chosen and the configured nodes but drops
          #              the pong,* properties the kernel reads from /arm-io.
          #   container  Android boot v4 with an empty kernel slot and the payload
          #              in the PONGFAT1 envelope PongBootMemoryDxe publishes.
          python3 device/scripts/finalize-pong-adt.py \
            --work-dir "UniXNU/out/${BOARD}/${OS_PROFILE}/${CONFIG}" \
            --uefi uefi-liuqin \
            --board "${BOARD}" \
            --abl-dtb "${RUNNER_TEMP}/stock/liuqin-cape.dtb" \
            --unique-chip-id "${UNIXNU_UNIQUE_CHIP_ID}" \
            --volume-layout ci-volume-layout.json
      - name: check the products
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, struct, zlib
          from pathlib import Path
          board = os.environ['BOARD']
          root = Path('UniXNU/out') / board
          image_name = '%s-xnu-initial.img' % board
          wanted = ('boot/boot.img', 'boot/' + image_name, 'payload/payload.img',
                    'kernel/kernel.macho', 'package.manifest.json', 'boot/pong-boot.json',
                    'payload/pong-boot-manifest.json')
          found = {}
          for name in wanted:
              paths = sorted(root.rglob(name))
              if len(paths) != 1:
                  raise SystemExit('%s: expected one file, found %s' % (name, paths))
              found[name] = paths[0]
              data = paths[0].read_bytes()
              print('%-38s %12d bytes  sha256 %s' % (name, len(data), hashlib.sha256(data).hexdigest()[:16]))
          report = json.loads(found['boot/pong-boot.json'].read_text())
          # The RAM-only image: Android boot v4, the firmware in the kernel slot
          # (gzip BootShim + FD, then the stock Cape SoC DTB), the payload in a
          # PONGFAT1 envelope, an empty signature area.
          image = found['boot/' + image_name].read_bytes()
          header = image[:4096]
          if header[:8] != b'ANDROID!' or struct.unpack_from('<I', header, 40)[0] != 4:
              raise SystemExit('%s is not an Android boot v4 container' % image_name)
          kernel_bytes, ramdisk_bytes = struct.unpack_from('<2I', header, 8)
          if struct.unpack_from('<I', header, 20)[0] != 1584:
              raise SystemExit('the header size is not 1584')
          kernel = image[4096:4096 + kernel_bytes]
          unpacker = zlib.decompressobj(31)
          firmware = unpacker.decompress(kernel)
          if not unpacker.eof or firmware[56:60] != b'ARM\x64':
              raise SystemExit('the kernel slot is not gzip(BootShim + FD)')
          dtb = unpacker.unused_data
          cape = Path(os.environ['RUNNER_TEMP'], 'stock', 'liuqin-cape.dtb').read_bytes()
          if dtb != cape:
              raise SystemExit('the DTB after the firmware is not the stock Cape SoC DTB')
          ramdisk_at = 4096 + -(-kernel_bytes // 4096) * 4096
          if image[ramdisk_at:ramdisk_at + 8] != b'PONGFAT1':
              raise SystemExit('the ramdisk does not begin with the PONGFAT1 envelope')
          if any(image[-4096:]):
              raise SystemExit('the signature area is not empty')
          # The ABL puts the vendor ramdisk of vendor_boot (21.7 MiB on
          # V14.0.9.0.TMYCNXM) in front of this one; PongBootMemoryDxe scans at most
          # 128 MiB of the joined initrd.
          vendor_ramdisk = 22758937
          if ramdisk_bytes + vendor_ramdisk + 4096 > 128 * 1024 * 1024:
              raise SystemExit('the initrd would be %d bytes with the vendor ramdisk, over the firmware limit'
                               % (ramdisk_bytes + vendor_ramdisk))
          spec = found['boot/boot.img'].read_bytes()
          if spec[4096:4104] == b'PONGFAT1':
              raise SystemExit('boot.img should be the spec image, not the bootable one')
          parameters = report['parameters']
          if parameters['dram_size'] != '0x200000000' or parameters['window_size'] != '0x100000000' or parameters['cpus'] != 1:
              raise SystemExit('the ADT parameters are not the liuqin ones: %r' % (parameters,))
          package = json.loads(found['package.manifest.json'].read_text())
          print('firmware', len(firmware), 'bytes; Cape DTB', len(dtb), 'bytes; initrd', ramdisk_bytes, 'bytes')
          print('kernel command line', package['kernel_command_line_bytes'], 'bytes')
          print('ADT', report['adt_bytes'], 'bytes, args', report['boot_args'][:64], '...')
          if report.get('hardware_tested') is not True:
              print('note: no device has run this boot image')
          PY
      - name: collect the products
        if: always()
        run: |
          set -euo pipefail
          mkdir -p products
          # The artifacts are the files themselves, not the whole output root: the
          # build tree under it holds objects and linked sources.
          if [ -d UniXNU/out ]; then
            find UniXNU/out \( -path '*/boot/*' -o -path '*/payload/*.img' \
              -o -path '*/payload/*.json' -o -path '*/kernel/*' \
              -o -name 'package.manifest.json' -o -name '*.log' \) \
              | while read -r f; do
                  mkdir -p "products/$(dirname "$f")"
                  cp -f "$f" "products/$f"
                done
          fi
          # The kit's Darwin 24 build writes its log and result beside its tree.
          mkdir -p products/device-build
          for f in build-*.log PONG_BUILD_RESULT.json; do
            [ -f "$f" ] && cp -f "$f" products/device-build/ || true
          done
          [ -f ci-volume-layout.json ] && cp -f ci-volume-layout.json products/ || true
          [ -f device/local.toml ] && cp -f device/local.toml products/local.toml || true
          du -sh products
          find products -type f | head -n 40
      - name: encrypt the products
        if: always()
        env:
          ARTIFACT_PASSWORD: ${{ secrets.LIUQIN_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p upload
          if [ -d products ] && [ -n "$(find products -type f | head -1)" ]; then
            ( cd products && find . -type f -exec shasum -a 256 {} + > SHA256SUMS )
            ( cd products && 7zz a -t7z -mx=1 -mhe=on "-p${ARTIFACT_PASSWORD}" ../upload/liuqin-package.7z . > /dev/null )
            7zz t "-p${ARTIFACT_PASSWORD}" upload/liuqin-package.7z | tail -3
            rm -rf products
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liuqin-package
          retention-days: 3
          if-no-files-found: warn
          compression-level: 0
          path: upload/
