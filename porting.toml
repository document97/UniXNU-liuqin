schema_version = 1

[device]
name = "liuqin"
soc = "SM8475"
os_profile = "ipados-18.7.10-22H374"
summary = "Xiaomi Pad 6 Pro (liuqin) on the SM8475 stack of UniXNU-pong: board data, first-boot configuration and stage-1 firmware; nothing is device-verified yet"

[[area]]
id = "configuration"
status = "implemented"
components = ["PongPlatform24"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", ".gitmodules", "configs/**", "dts/**", "migration/format2/**", ".github/workflows/**", "README.md"]
inputs = ["UniXNU-pong e0ee6df (same SM8475 SoC, PMIC family, UFS host, Adreno 730, QCA6490)", "mainline liuqin tree yzddmr6/linux-sm8450-liuqin fe81794b (not committed; scripts/gen-liuqin-memory.py --fetch caches it in the ignored reference/mainline)", "stock uefiplat.cfg of V14.0.9.0.TMYCNXM (the build on the tablet; read from its uefi.elf), whose HYP/PIL/Demura/FD/splash regions equal OS3.0.7.0.VMYCNXM's (1696108518/UniXNU-liuqin docs/vendor-inputs.md)"]
configuration = ["board.toml selects dts/liuqin.dts, liuqin_ipados18_defconfig, uefi-liuqin liuqinPkg and configs/liuqin-board.json"]
procedure = ["Keep the pong SM8475 implementation and its build entry points; replace board data only: memory, panel geometry and scale, touch wiring, identity, firmware package and boot DTB."]
findings = ["liuqin shares every SoC resource the pong ADT generator encodes (GIC 0x17100000/0x17180000 stride 0x40000, UFS 0x1d84000 SID 0xe0 SPI 265, SMMU 0x15000000).", "Touch is on the same bus as pong's (QUP0 SE4 spi@990000, IRQ gpio21); the controller differs (Novatek NT36532, no reset line).", "Power, volume-down (PON) and volume-up (PM8350 GPIO6, PPID 0x18d) match pong's keys.", "QCA6490 WLAN enable gpio80 and xo-clk gpio204 match pong's pcie0 node."]
completion = ["The stage-1 image reaches the UniXNU menu on the tablet, then the stage-2 image reaches SpringBoard."]
limits = ["Internal component, kernel argument and script names stay pong_*: they name the shared SM8475 implementation."]
next_action = ["Run the stage-1 workflow of uefi-liuqin with a liuqin full OTA package and boot its image with fastboot boot."]
evidence = [{kind = "source", reference = "configs/liuqin-board.json", result = "Board data file read by scripts/make-pong-adt-ipados18.py --board liuqin; pong's defaults are unchanged."}]

[[area]]
id = "firmware"
status = "implemented"
components = ["PongPlatform24"]
paths = ["tools/fetch-liuqin-stock.py", "scripts/build-bootimg.py"]
inputs = ["uefi-liuqin branch liuqin: Platforms/Xiaomi/liuqinPkg derived from pongPkg", "stock Cape SoC base DTB of liuqin vendor_boot (ABL selects by msm-id 0x212/0x213/0x21c, board-id 0x10008)"]
configuration = ["FD 0xA7100000 +0x300000 inside the stock UEFI FD window; SimpleFbDxe GOP on 0xB8000000 1800x2880 stride 7200; vendor modules Binaries/pong or Binaries/liuqin"]
procedure = ["tools/fetch-liuqin-stock.py extracts vendor_boot, uefi and dtbo from a full OTA package and selects the Cape SoC DTB.", "uefi-liuqin .github/workflows/liuqin-uefi.yml builds the firmware and the v4 boot image."]
findings = ["The stock PIL Reserved (0x85200000 +0x1DC00000) overlaps Display Demura; the first-listed-wins union equals the pong descriptors' union 0x85200000-0xA3F00000.", "A previous liuqin attempt with a Cape DTB from vendor_boot reached the DarwinBoot handoff (1696108518/UniXNU-liuqin docs/liuqin-boot-progress.md)."]
completion = ["fastboot boot of Mu-liuqin.img shows the UniXNU menu; with a payload it lists the entry and DarwinBoot hands off."]
limits = ["Not built or booted here; the host had no EDK II toolchain."]
next_action = ["Boot Mu-liuqin.img from the stage-1 workflow and photograph the panel."]
evidence = [{kind = "source", reference = "tools/fetch-liuqin-stock.py", result = "Host test with a synthetic full OTA (stored zip, REPLACE and REPLACE_XZ, three base DTBs) wrote byte-identical partitions and selected the Cape SoC DTB."}]

[[area]]
id = "memory"
status = "implemented"
components = ["PongPlatform24"]
paths = ["configs/liuqin-memory-sm8475.json", "scripts/gen-liuqin-memory.py"]
inputs = ["8 GB unit /memory from the stock ABL: 0x80000000+0x6A000000, 0xF1400000+0xEC00000, 0x800000000+0x39700000, 0x839D00000+0x1E00000, 0x840000000+0x140000000 (1696108518/iPadOS-liuqin NOTES.md 6.2)"]
configuration = ["Reserved = union of mainline liuqin reserved-memory, stock uefiplat.cfg and the pong SM8475 vendor capture; allocatable = DRAM minus that union"]
procedure = ["python3 scripts/gen-liuqin-memory.py [--fetch] [--dram base:size,...] regenerates the file and the memory/reserved-memory of dts/liuqin.dts."]
findings = ["7.81 GiB in five banks; 58 distinct reserved ranges; 12 allocatable ranges, 6.33 GiB.", "Every Reserv/RtData region of the V14.0.9.0.TMYCNXM uefiplat.cfg is excluded; HYP Reserved 0x830000000 +0x10000000 was allocatable before it was read.", "The kernel intersects every allocatable range with the boot's EfiConventionalMemory, so the union can only over-reserve."]
completion = ["DarwinBoot claims its window from these ranges and the kernel reaches launchd without a memory fault."]
limits = ["The 12 GB variant needs its own --dram; this tablet's /sys/firmware/fdt should replace the mainline input when captured."]
next_action = ["Capture /sys/firmware/fdt on the tablet and regenerate."]
evidence = [{kind = "source", reference = "scripts/gen-liuqin-memory.py", result = "Generated 5 banks 7.81 GiB, 99 reserved entries, 12 allocatable ranges 6.33 GiB; dts/liuqin.dts is written by the same run."}]

[[area]]
id = "display"
status = "planned"
components = ["PongPlatform24"]
paths = ["configs/liuqin-board.json"]
inputs = ["CSOT m81_42_02_0b NT36532 TDDI, dual DSI, DSC, video mode, 1800x2880; KTZ8866 backlight on i2c1 0x11"]
configuration = ["First boot: GOP framebuffer left lit by the ABL continuous splash, display-scale 2, no backlight driver"]
procedure = ["Render in software into the GOP framebuffer; add a KTZ8866 brightness driver after the desktop is reached."]
findings = ["PongBacklight accepts only pong's DSI controller and stays inactive without its /chosen property, which the liuqin ADT omits."]
completion = ["SpringBoard renders on the panel, then brightness follows the slider."]
limits = ["No refresh-rate or brightness control yet."]
next_action = ["Reach SpringBoard on the GOP framebuffer."]
evidence = [{kind = "source", reference = "scripts/make-pong-adt-ipados18.py", result = "liuqin ADT carries display-scale 2 and no pong-dsi-backlight."}]

[[area]]
id = "input"
status = "planned"
components = ["PongPlatform24"]
paths = ["dts/liuqin.dts", "configs/liuqin-board.json"]
inputs = ["NT36532 on spi@990000 CS0, 9.6 MHz, IRQ gpio21, swrst 0x1fb43e, firmware novatek/liuqin/novatek_nt36532_m81_fw_csot.bin"]
configuration = ["pong_touch=0; the liuqin-touch ADT node matches no driver yet; keys use pong-buttons unchanged"]
procedure = ["Port an NT36532 SPI driver onto pong's QUP0 SE4 transport, following UniXNU-sheng ShengNovatekTouch for the protocol."]
findings = ["Same SPI engine and IRQ line as pong; the TDDI die is reset by the panel and needs its firmware after every panel prepare."]
completion = ["Touches reach SpringBoard; keys lock and change volume."]
limits = ["No touch on first boot."]
next_action = ["Write the NT36532 transport after the desktop is reached."]
evidence = [{kind = "source", reference = "yzddmr6/linux-sm8450-liuqin@fe81794b arch/arm64/boot/dts/qcom/sm8475-xiaomi-liuqin.dts", result = "touchscreen@0 on spi4, IRQ gpio21, no reset gpio."}]

[[area]]
id = "storage"
status = "planned"
components = ["PongPlatform24"]
paths = ["board.toml"]
inputs = ["UFS host 0x1d84000, SID 0xe0, SPI 265 (same SoC); this tablet's GPT"]
configuration = ["[userdata] first_lba/last_lba must be read from this tablet's GPT before a userdata image is built"]
procedure = ["Read the userdata entry with sgdisk or the stock partition table, update board.toml, then build the userdata image."]
findings = []
completion = ["The root and Data volumes mount from UFS."]
limits = ["board.toml still holds pong's userdata geometry; the install scripts compare it with the device GPT and stop on a mismatch."]
next_action = ["Record this tablet's userdata LBAs."]
evidence = [{kind = "source", reference = "board.toml", result = "userdata geometry not yet measured on this tablet."}]

[[area]]
id = "packaging"
status = "planned"
components = ["PongPlatform24"]
paths = [".github/workflows/package.yml", "scripts/finalize-pong-adt.py"]
inputs = ["pong package workflow (macOS runner): kernel, payload, PONGFAT1 boot image"]
configuration = ["Stage 2 runs the same workflow with the liuqin board, firmware and Cape DTB"]
procedure = ["Point package.yml at uefi-liuqin and the Cape DTB, pass --board liuqin to the ADT step and 8 GiB of DRAM."]
findings = []
completion = ["boot/liuqin-xnu-initial.img boots to launchd."]
limits = ["finalize-pong-adt.py still writes pong paths and 12 GiB of DRAM."]
next_action = ["Adapt finalize-pong-adt.py and package.yml after stage 1 passes."]
evidence = [{kind = "source", reference = ".github/workflows/package.yml", result = "Unchanged pong workflow; liuqin stage 2 pending."}]
